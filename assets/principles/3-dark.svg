<style>@font-face{font-family:S;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:S;font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:P;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
