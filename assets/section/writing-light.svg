<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-label="04 Writing: latest on Medium">
<title>04 Writing: latest on Medium</title>
<style>@font-face{font-family:S;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:S;font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:P;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
.s{font-family:S,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:P,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.draw{stroke-dasharray:1;animation:draw 1.2s cubic-bezier(.65,0,.35,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(0)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3.4)}}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .35s cubic-bezier(.5,0,.75,0) both}
@keyframes stamp{from{opacity:0;transform:scale(1.8)}}
.loop{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

<rect width="1200" height="112" fill="#EFEBE3"/>
<g class="up" style="animation-delay:0.1s"><text x="60" y="62" class="m" font-size="16" fill="#B83D17">04</text><text x="112" y="64" class="s" font-size="34" font-weight="600" letter-spacing="-1" fill="#151513">Writing</text><text x="1140" y="62" text-anchor="end" class="m" font-size="13" fill="#6E6A61">latest on Medium</text></g>
<path d="M60 86H1140" pathLength="1" stroke="#151513" stroke-width="1.5" class="draw" style="animation-delay:0.2s"/>
<g class="pop" style="animation-delay:0.3s"><path d="M60 80v12" stroke="#151513" stroke-width="1.5"/></g><g class="pop" style="animation-delay:1.3s"><path d="M1140 80v12" stroke="#151513" stroke-width="1.5"/></g>
</svg>
