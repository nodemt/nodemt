name: Latest blog post workflow
on:
    schedule:
        - cron: '0 * * * *'
    workflow_dispatch:
permissions:
    contents: write
jobs:
    update-readme-with-blog:
        name: Render the latest Medium posts into the README
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: scripts/package-lock.json
            - run: npm ci --prefix scripts
            # Fetches the feed, renders one SVG row per post and rewrites the README's WRITING block.
            - run: node scripts/render-writing.mjs
            - name: Commit if anything changed
              run: |
                git add README.md assets/writing
                git diff --cached --quiet && exit 0
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git commit -m "Updated with the latest blog posts"
                git push
